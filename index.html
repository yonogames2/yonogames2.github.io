<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YONO GAMES</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top, #0b5a3d 0%, #063d2a 45%, #021f15 100%);
    color: white;
}

/* HEADER */

.header {
    width: 100%;
    padding: 15px 15px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #ffffff;
}

.menu-btn {
    font-size: 26px;
    cursor: pointer;
}

/* MENU */

.menu {
    display: none;
    position: absolute;
    right: 12px;
    top: 58px;
    width: 170px;
    background: #063d2a;
    border: 1px solid #167653;
    border-radius: 12px;
    padding: 8px;
    z-index: 1000;
}

.menu a {
    display: block;
    color: white;
    text-decoration: none;
    padding: 11px;
    border-radius: 8px;
}

.menu a:hover {
    background: #0b543b;
}

/* SEARCH */

.search-box {
    padding: 8px 15px;
}

.search-box input {
    width: 100%;
    padding: 13px 15px;
    border: none;
    outline: none;
    border-radius: 12px;
    background: #0b543b;
    color: white;
    font-size: 15px;
}

.search-box input::placeholder {
    color: #b9d5ca;
}

/* CATEGORY BUTTONS */

.category-buttons {
    display: flex;
    gap: 10px;
    padding: 10px 15px;
}

.category-buttons button {
    flex: 1;
    padding: 12px 8px;
    border: none;
    border-radius: 10px;
    background: #0b543b;
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.category-buttons button.active {
    background: #159b68;
}

/* SECTION TITLE */

.category-heading,
.others-title,
.new-launch-title {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    margin: 12px 15px;
}

/* OTHERS EXTRA FEATURES */

#others-extra {
    display: none;
}

/* BANNER */

.banner-section {
    width: calc(100% - 30px);
    margin: 10px 15px 15px;
    aspect-ratio: 2.35 / 1;
    overflow: hidden;
    border-radius: 14px;
    position: relative;
    background: #063d2a;
}

.banner-track {
    width: 100%;
    height: 100%;
    display: flex;
    transition: transform 0.6s ease-in-out;
}

.banner-slide {
    min-width: 100%;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* TELEGRAM */

.telegram-section {
    text-align: center;
    margin: 15px;
}

.telegram-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

.telegram-btn {
    display: inline-block;
    padding: 11px 25px;
    border-radius: 10px;
    background: #159b68;
    color: white;
    text-decoration: none;
    font-weight: bold;
}

/* GAME LIST */

#game-list {
    padding: 0 15px 20px;
}

/* GAME CARD */

.game-card {
    width: 100%;
    min-height: 145px;
    margin-bottom: 12px;
    padding: 10px;
    display: grid;
    grid-template-columns: 74px 1fr 82px;
    gap: 10px;
    align-items: center;

    background: #0b543b;
    border: 1px solid #167653;
    border-radius: 14px;
}

.game-logo {
    width: 74px;
    height: 74px;
    border-radius: 14px;
    object-fit: cover;
    background: #063d2a;
}

.game-info {
    min-width: 0;
}

.game-name {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 8px;
    word-break: break-word;
}

.signup-bonus {
    color: #ff4b4b;
    font-size: 14px;
    margin-bottom: 7px;
    font-weight: bold;
}

.minimum-withdrawal {
    color: white;
    font-size: 13px;
}

.game-action {
    text-align: center;
}

.download-btn {
    display: inline-block;
    width: 82px;
    padding: 9px 4px;
    border-radius: 9px;
    background: #159b68;
    color: white;
    text-decoration: none;
    font-size: 12px;
    font-weight: bold;
}

.game-rating {
    margin-top: 8px;
    font-size: 12px;
}

.game-size {
    margin-top: 4px;
    font-size: 11px;
    color: #c5ddd4;
}

/* NEW LAUNCH */

#new-launch-section {
    padding: 0 15px;
}

.new-launch-box {
    margin-bottom: 15px;
}

/* MESSAGES */

.message {
    text-align: center;
    padding: 30px 15px;
    color: #c8ddd6;
    font-size: 15px;
}

/* OWNER */

.owner {
    text-align: center;
    padding: 10px 15px 25px;
    color: #9bbdb0;
    font-size: 12px;
}

/* MOBILE */

@media (max-width: 400px) {

    .game-card {
        grid-template-columns: 68px 1fr 76px;
        gap: 8px;
    }

    .game-logo {
        width: 68px;
        height: 68px;
    }

    .download-btn {
        width: 76px;
    }

    .game-name {
        font-size: 15px;
    }

}

</style>
</head>

<body>

<!-- HEADER -->

<div class="header">

    <div class="logo">
        YONO GAMES
    </div>

    <div class="menu-btn" id="menu-btn">
        ☰
    </div>

</div>

<!-- MENU -->

<div class="menu" id="menu">

    <a href="#">Home</a>
    <a href="#">Contact</a>
    <a href="#">Privacy Policy</a>

</div>

<!-- SEARCH -->

<div class="search-box">

    <input
        type="text"
        id="search-input"
        placeholder="Search games..."
    >

</div>

<!-- CATEGORY BUTTONS -->

<div class="category-buttons">

    <button id="yono-btn" class="active">
        YONO GAMES
    </button>

    <button id="others-btn">
        OTHERS GAMES
    </button>

</div>


<!-- ================================================= -->
<!-- OTHERS ONLY FEATURES                              -->
<!-- ================================================= -->

<div id="others-extra">

    <div class="others-title">
        OTHERS GAMES
    </div>


    <!-- AUTO SLIDER -->

    <div class="banner-section">

        <div class="banner-track" id="banner-track">

            <img
                class="banner-slide"
                src="banner1.jpg"
                alt="Banner 1"
            >

            <img
                class="banner-slide"
                src="banner2.jpg"
                alt="Banner 2"
            >

            <img
                class="banner-slide"
                src="banner3.jpg"
                alt="Banner 3"
            >

            <img
                class="banner-slide"
                src="banner4.jpg"
                alt="Banner 4"
            >

            <img
                class="banner-slide"
                src="banner5.jpg"
                alt="Banner 5"
            >

        </div>

    </div>


    <!-- TELEGRAM -->

    <div class="telegram-section">

        <div class="telegram-title">
            JOIN TELEGRAM
        </div>

        <a
            class="telegram-btn"
            href="#"
            target="_blank"
        >
            JOIN TELEGRAM
        </a>

    </div>


    <!-- DOWNLOAD NEW GAMES -->

    <div class="category-heading">
        DOWNLOAD NEW GAMES
    </div>

</div>


<!-- ================================================= -->
<!-- NEW LAUNCH                                         -->
<!-- ================================================= -->

<div id="new-launch-section">

    <div class="new-launch-title">
        NEW LAUNCH
    </div>

    <div
        id="new-launch-card"
        class="new-launch-box"
    ></div>

</div>


<!-- ================================================= -->
<!-- GAME LIST                                          -->
<!-- ================================================= -->

<div id="game-list">

    <div class="message">
        Loading games...
    </div>

</div>


<div class="owner">
    YONO GAMES
</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="script.js"></script>

</body>
    </html>
