<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>YONO GAMES</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        font-family: Arial, sans-serif;
        background: #021d14;
        color: white;
    }

    body {
        padding-bottom: 30px;
    }

    .header {
        text-align: center;
        padding: 20px 12px 12px;
    }

    .header h1 {
        margin: 0;
        font-size: 28px;
        color: #39e58c;
    }

    .header p {
        margin: 6px 0 0;
        color: #a9c9bc;
        font-size: 13px;
    }

    .search-box {
        padding: 10px 12px;
    }

    #search {
        width: 100%;
        height: 46px;
        border: 1px solid #176746;
        border-radius: 12px;
        outline: none;
        padding: 0 15px;
        font-size: 15px;
        background: #063d2a;
        color: white;
    }

    #search::placeholder {
        color: #91afa3;
    }

    .tabs {
        display: flex;
        gap: 10px;
        padding: 8px 12px 14px;
    }

    .tab {
        flex: 1;
        border: 1px solid #176746;
        border-radius: 10px;
        background: #063d2a;
        color: white;
        padding: 12px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
    }

    .tab.active {
        background: #0b543b;
        border-color: #39e58c;
        color: #39e58c;
    }

    #game-list {
        padding: 0 10px;
    }

    .game-card {
        display: grid;
        grid-template-columns: 74px 1fr 88px;
        gap: 10px;
        align-items: center;

        min-height: 145px;
        margin-bottom: 12px;
        padding: 10px;

        background: #0b543b;
        border: 1px solid #176746;
        border-radius: 15px;
    }

    .game-logo-box {
        width: 74px;
        height: 74px;
        border-radius: 14px;
        overflow: hidden;
        background: #063d2a;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 30px;
    }

    .game-logo {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
    }

    .game-info {
        min-width: 0;
    }

    .game-name {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 8px;

        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .signup-bonus {
        color: #ff5b5b;
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 7px;
    }

    .minimum-withdrawal {
        color: white;
        font-size: 13px;
    }

    .game-action {
        text-align: center;
    }

    .download-btn {
        width: 82px;
        min-height: 58px;

        border: none;
        border-radius: 10px;

        background: #39e58c;
        color: #032116;

        font-size: 13px;
        font-weight: bold;

        cursor: pointer;
    }

    .download-btn:active {
        transform: scale(0.96);
    }

    .game-meta {
        margin-top: 8px;
        font-size: 12px;
        color: white;
        line-height: 18px;
    }

    .game-meta span {
        margin: 0 3px;
        color: #8fb8a7;
    }

    .message {
        margin: 20px 5px;
        padding: 18px;
        text-align: center;

        background: #063d2a;
        border: 1px solid #176746;
        border-radius: 12px;

        color: #d8eee5;
        line-height: 22px;
    }

    @media (max-width: 380px) {

        .game-card {
            grid-template-columns: 65px 1fr 78px;
            gap: 8px;
        }

        .game-logo-box {
            width: 65px;
            height: 65px;
        }

        .game-name {
            font-size: 16px;
        }

        .signup-bonus {
            font-size: 12px;
        }

        .minimum-withdrawal {
            font-size: 11px;
        }

        .download-btn {
            width: 74px;
            font-size: 12px;
        }
    }
</style>

</head><body><div class="header">
    <h1>🎮 YONO GAMES</h1>
    <p>Play & Discover Games</p>
</div>

<div class="search-box">
    <input
        type="text"
        id="search"
        placeholder="⌕ Search games..."
        autocomplete="off"
    >
</div>

<div class="tabs">
    <button id="yono-tab" class="tab active">
        🎮 YONO GAMES
    </button>

    <button id="others-tab" class="tab">
        🎮 OTHERS GAMES
    </button>
</div>

<div id="game-list">
    <div class="message">
        Loading games...
    </div>
</div>


<!-- Supabase library FIRST -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Your JavaScript SECOND -->
<script src="script.js"></script>

</body></html>
