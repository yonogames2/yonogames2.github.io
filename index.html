<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YONO GAMES</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;

    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(circle at 50% 10%, rgba(0,255,40,.10), transparent 30%),
        linear-gradient(180deg, #001b08 0%, #002b10 45%, #001d0a 100%);
}

/* HEADER */

.header {
    text-align: center;
    padding: 18px 10px 12px;
}

.header h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 1px;
}
    .header .tagline {
    margin: 8px 10px 0;
    color: #9fffae;
    font-size: 14px;
    font-weight: 600;
    }
    
/* SEARCH */

.search-box {
    width: calc(100% - 24px);
    max-width: 900px;
    height: 62px;

    margin: 12px auto 18px;

    border: 1px solid #39ff14;
    border-radius: 20px;

    background: rgba(0, 45, 10, .65);

    box-shadow: 0 0 12px rgba(57,255,20,.25);

    display: flex;
    align-items: center;

    padding: 0 20px;
}

.search-box input {
    width: 100%;
    height: 100%;

    border: none;
    outline: none;

    background: transparent;
    color: white;

    font-size: 18px;
}

.search-box input::placeholder {
    color: #aaa;
}

/* CATEGORY BUTTONS */

.category-buttons {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 0;

    width: calc(100% - 24px);
    max-width: 900px;

    margin: 0 auto 18px;

    padding: 6px;

    border: 1px solid #39ff14;
    border-radius: 20px;

    background: rgba(0, 35, 8, .35);
}

.category-btn {
    height: 48px;

    border: none;
    border-radius: 14px;

    background: transparent;

    color: #999;

    font-size: 16px;
    font-weight: 700;

    cursor: pointer;

    transition: .2s;
}

.category-btn:hover {
    background: rgba(20,180,0,.15);
}

.category-btn:active {
    transform: scale(.98);
}

/* Active button */

.category-btn.active {
    color: white;

    background:
        linear-gradient(
            180deg,
            #49ff18,
            #17bd00
        );

    box-shadow:
        0 0 16px rgba(57,255,20,.55);
}

/* GAMES */

#game-list {
    width: calc(100% - 16px);
    max-width: 900px;

    margin: 0 auto;

    padding-bottom: 30px;
}

/* GAME CARD */

.game-card {
    position: relative;

    display: grid;

    grid-template-columns: 145px 1fr 250px;

    gap: 15px;

    width: 100%;
    min-height: 155px;

    margin-bottom: 15px;

    padding: 14px;

    background:
        linear-gradient(
            90deg,
            rgba(0,45,12,.96),
            rgba(0,70,18,.65)
        );

    border: 1px solid #28e916;

    border-radius: 20px;

    box-shadow:
        0 0 10px rgba(57,255,20,.20),
        inset 0 0 18px rgba(0,255,40,.04);

    align-items: center;
}

/* LOGO */

.game-logo {
    width: 130px;
    height: 130px;

    border: 1px solid rgba(100,255,80,.8);

    border-radius: 18px;

    background: #063b16;

    overflow: hidden;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 45px;
}

.game-logo img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}

/* GAME INFO */

.game-info {
    min-width: 0;

    display: flex;
    flex-direction: column;

    justify-content: center;
}

.game-name {
    font-size: 26px;
    font-weight: bold;

    margin-bottom: 12px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.signup {
    color: #ff5b5b;

    font-size: 18px;
    font-weight: 700;

    margin-bottom: 7px;
}

.withdraw {
    color: white;

    font-size: 18px;
    font-weight: 600;
}

/* DOWNLOAD SIDE */

.game-action {
    display: flex;

    flex-direction: column;

    align-items: stretch;

    justify-content: center;

    gap: 10px;
}

/* DOWNLOAD BUTTON */

.download-btn {
    min-height: 58px;

    display: flex;

    align-items: center;
    justify-content: center;

    gap: 10px;

    width: 100%;

    border-radius: 14px;

    text-decoration: none;

    background:
        linear-gradient(
            180deg,
            #48ff18,
            #18bd00
        );

    color: white;

    font-size: 20px;
    font-weight: bold;

    box-shadow:
        0 0 14px rgba(57,255,20,.45);

    transition: .15s;
}

.download-btn:hover {
    filter: brightness(1.08);
}

.download-btn:active {
    transform: scale(.98);
}

/* RATING + SIZE */

.game-meta {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 12px;

    font-size: 18px;

    font-weight: 600;

    color: #fff;

    text-align: center;
}

.game-meta .star {
    color: #ffd900;

    font-size: 23px;
}

.game-meta .separator {
    color: #aaa;
}

/* MESSAGE */

.message {
    text-align: center;

    padding: 35px 10px;

    color: #aaa;

    font-size: 18px;
}

/* MOBILE */

@media (max-width: 700px) {

    .header {
        padding: 16px 12px 8px;
    }

    .header h1 {
        font-size: 24px;
    }

    .search-box {
        height: 62px;

        margin-top: 15px;

        border-radius: 20px;
    }

    .search-box input {
        font-size: 18px;
    }

    .category-buttons {
        border-radius: 20px;
    }

    .category-btn {
        font-size: 14px;
        padding: 13px 3px;
    }

    .game-card {
        min-height: 140px;

        grid-template-columns: 82px 1fr;

        gap: 12px;

        padding: 12px;

        border-radius: 17px;
    }

    .game-logo {
        width: 82px;
        height: 82px;

        border-radius: 14px;

        font-size: 30px;
    }

    .game-name {
        font-size: 20px;

        margin-bottom: 8px;
    }

    .signup {
        font-size: 14px;

        margin-bottom: 5px;
    }

    .withdraw {
        font-size: 14px;
    }

    .game-action {
        grid-column: 2;

        gap: 8px;
    }

    .download-btn {
        min-height: 45px;

        font-size: 16px;
    }

    .game-meta {
        font-size: 14px;
    }

    .game-meta .star {
        font-size: 18px;
    }
}

/* SMALL MOBILE */

@media (max-width: 380px) {

    .game-card {
        grid-template-columns: 72px 1fr;

        gap: 9px;

        padding: 10px;
    }

    .game-logo {
        width: 72px;
        height: 72px;
    }

    .game-name {
        font-size: 17px;
    }

    .signup {
        font-size: 13px;
    }

    .withdraw {
        font-size: 12px;
    }

    .download-btn {
        font-size: 14px;
    }

    .game-meta {
        font-size: 12px;
    }
}

</style>
</head>

<body>

<div class="header">
    <h1>🎮 YONO GAMES</h1>
    <p class="tagline">
    Discover Top & Trusted Online Games in India
    </p>
</div>

<div class="search-box">

    <input
        type="text"
        id="search"
        placeholder="🔍 Search games..."
        autocomplete="off"
    >

</div>

<div class="category-buttons">

    <button
        id="yono-btn"
        class="category-btn active"
        type="button"
    >
        🎮 YONO GAMES
    </button>

    <button
        id="others-btn"
        class="category-btn"
        type="button"
    >
        🎮 OTHERS GAMES
    </button>

</div>

<div id="game-list">

    <div class="message">
        Loading games...
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="script.js"></script>

</body>

    </html>
