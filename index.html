<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YONO GAMES - DEMO</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;

    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(
            circle at 50% 10%,
            rgba(0,255,40,.10),
            transparent 30%
        ),
        linear-gradient(
            180deg,
            #001b08 0%,
            #002b10 45%,
            #001d0a 100%
        );
}


/* HEADER */

.header {
    text-align: center;
    padding: 18px 10px 12px;
}

.header h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 1px;
}

.header .tagline {
    margin: 8px 10px 0;
    color: #9fffae;
    font-size: 14px;
    font-weight: 600;
}


/* SEARCH */

.search-box {
    width: calc(100% - 24px);
    max-width: 900px;

    height: 62px;

    margin: 12px auto 18px;

    border: 1px solid #39ff14;
    border-radius: 20px;

    background: rgba(0,45,10,.65);

    box-shadow:
        0 0 12px rgba(57,255,20,.25);

    display: flex;
    align-items: center;

    padding: 0 20px;
}

.search-box input {
    width: 100%;
    height: 100%;

    border: none;
    outline: none;

    background: transparent;
    color: white;

    font-size: 18px;
}

.search-box input::placeholder {
    color: #aaa;
}


/* CATEGORY HEADING */

.category-heading {
    width: calc(100% - 24px);
    max-width: 900px;

    margin: 0 auto 10px;

    text-align: center;

    color: white;

    font-size: 19px;
    font-weight: 800;
}


/* CATEGORY BUTTONS */

.category-buttons {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 0;

    width: calc(100% - 24px);
    max-width: 900px;

    margin: 0 auto 18px;

    padding: 6px;

    border: 1px solid #39ff14;
    border-radius: 20px;

    background: rgba(0,35,8,.35);
}

.category-btn {
    position: relative;

    height: 48px;

    border: none;
    border-radius: 14px;

    background: transparent;

    color: #999;

    font-size: 16px;
    font-weight: 700;

    cursor: pointer;

    transition: .2s;

    overflow: hidden;

    isolation: isolate;
}

.category-btn:hover {
    background: rgba(20,180,0,.15);
}

.category-btn:active {
    transform: scale(.98);
}


/* ACTIVE BUTTON */

.category-btn.active {
    color: white;

    background:
        linear-gradient(
            180deg,
            #49ff18,
            #17bd00
        );

    box-shadow:
        0 0 16px rgba(57,255,20,.55);
}


/* ================================================= */
/* OTHERS RED MOVING LIGHT                          */
/* ================================================= */

    content: "";

    position: absolute;

    width: 12px;
    height: 12px;

    background: #ff0000;

        0 0 12px #ff0000,
        0 0 22px #ff0000,
        0 0 32px rgba(255,0,0,.8);
