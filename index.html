<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YONO GAMES</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #021d14;
            color: white;
        }

        .header {
            text-align: center;
            padding: 20px 10px 12px;
        }

        .header h1 {
            margin: 0;
            color: #39e58c;
            font-size: 28px;
        }

        .header p {
            margin: 6px 0 0;
            color: #9dbdb0;
            font-size: 13px;
        }

        .search-box {
            padding: 10px;
        }

        #search {
            width: 100%;
            height: 45px;
            padding: 0 15px;
            border-radius: 12px;
            border: 1px solid #176746;
            outline: none;
            background: #063d2a;
            color: white;
            font-size: 15px;
        }

        #search::placeholder {
            color: #8ba99d;
        }

        .tabs {
            display: flex;
            gap: 10px;
            padding: 7px 10px 15px;
        }

        .tab {
            flex: 1;
            padding: 12px 5px;
            border-radius: 10px;
            border: 1px solid #176746;
            background: #063d2a;
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .tab.active {
            border-color: #39e58c;
            color: #39e58c;
            background: #0b543b;
        }

        #game-list {
            padding: 0 10px;
        }

        .game-card {
            display: grid;
            grid-template-columns: 74px 1fr 85px;
            gap: 10px;
            align-items: center;

            min-height: 140px;
            margin-bottom: 12px;
            padding: 10px;

            background: #0b543b;
            border: 1px solid #176746;
            border-radius: 15px;
        }

        .game-logo-box {
            width: 74px;
            height: 74px;
            border-radius: 14px;
            overflow: hidden;
            background: #063d2a;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 30px;
        }

        .game-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .signup-bonus {
            color: #ff5b5b;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .minimum-withdrawal {
            font-size: 12px;
        }

        .game-action {
            text-align: center;
        }

        .download-btn {
            width: 82px;
            min-height: 55px;
            border: 0;
            border-radius: 10px;
            background: #39e58c;
            color: #032116;
            font-weight: bold;
            font-size: 12px;
        }

        .game-meta {
            margin-top: 7px;
            font-size: 11px;
        }

        .message {
            padding: 18px;
            margin: 20px 5px;
            text-align: center;
            background: #063d2a;
            border: 1px solid #176746;
            border-radius: 12px;
        }

        @media (max-width: 380px) {

            .game-card {
                grid-template-columns: 65px 1fr 78px;
            }

            .game-logo-box {
                width: 65px;
                height: 65px;
            }

            .download-btn {
                width: 74px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🎮 YONO GAMES</h1>
        <p>Play & Discover Games</p>
    </div>

    <div class="search-box">
        <input
            id="search"
            type="text"
            placeholder="⌕ Search games..."
        >
    </div>

    <div class="tabs">

        <button
            id="yono-tab"
            class="tab active"
        >
            🎮 YONO GAMES
        </button>

        <button
            id="others-tab"
            class="tab"
        >
            🎮 OTHERS GAMES
        </button>

    </div>

    <div id="game-list">

        <div class="message">
            Loading games...
        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./script.js?v=5"></script>

</body>

    </html>
