<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YONO GAMES</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background:
                radial-gradient(
                    circle at top,
                    #0b543b,
                    #031c14 70%
                );

            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            padding: 20px 10px 15px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: bold;
        }

        .header p {
            margin-top: 5px;
            color: #9ed8c2;
            font-size: 13px;
        }


        /* SEARCH */

        .search-box {
            padding: 10px 12px;
        }

        .search-box input {
            width: 100%;
            padding: 13px 16px;

            border: 1px solid #187653;
            border-radius: 12px;

            background: #063d2a;
            color: white;

            font-size: 15px;

            outline: none;
        }

        .search-box input::placeholder {
            color: #9db9ae;
        }


        /* TABS */

        .tabs {
            display: flex;
            gap: 8px;
            padding: 8px 12px 14px;
        }

        .tab {
            flex: 1;

            border: none;
            border-radius: 10px;

            padding: 12px 5px;

            background: #063d2a;
            color: #b9d8cb;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;

            touch-action: manipulation;
        }

        .tab.active {
            background: #0b7a52;
            color: white;
        }


        /* GAME LIST */

        #game-list {
            padding: 0 10px 20px;
        }


        /* GAME CARD */

        .game-card {
            display: grid;

            grid-template-columns:
                74px
                minmax(0, 1fr)
                82px;

            gap: 10px;

            align-items: center;

            min-height: 145px;

            margin-bottom: 10px;
            padding: 12px;

            background:
                linear-gradient(
                    145deg,
                    #0b543b,
                    #063d2a
                );

            border: 1px solid #126b4a;

            border-radius: 15px;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.25);
        }


        /* LOGO */

        .game-logo-box {
            width: 74px;
            height: 74px;

            border-radius: 14px;

            background: #092b20;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            font-size: 35px;
        }

        .game-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }


        /* INFO */

        .game-info {
            min-width: 0;
        }

        .game-name {
            font-size: 17px;
            font-weight: bold;

            margin-bottom: 8px;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .signup-bonus {
            color: #ff5555;

            font-size: 13px;
            font-weight: bold;

            margin-bottom: 6px;
        }

        .minimum-withdrawal {
            color: white;
            font-size: 12px;
        }


        /* ACTION */

        .game-action {
            text-align: center;
        }

        .download-btn {
            width: 78px;

            border: none;
            border-radius: 10px;

            padding: 9px 4px;

            background: #13a56f;
            color: white;

            font-size: 13px;
            font-weight: bold;

            cursor: pointer;

            touch-action: manipulation;

            -webkit-tap-highlight-color: transparent;
        }

        .download-btn:active {
            transform: scale(0.96);
        }

        .game-meta {
            margin-top: 9px;

            color: #d7eee5;

            font-size: 11px;
        }


        /* MESSAGE */

        .message {
            text-align: center;

            padding: 35px 15px;

            color: #b9d8cb;

            font-size: 14px;
        }


        /* FOOTER */

        .footer {
            text-align: center;

            padding: 20px;

            color: #6f9c8b;

            font-size: 11px;
        }


        /* MOBILE */

        @media (max-width: 380px) {

            .game-card {
                grid-template-columns:
                    64px
                    minmax(0, 1fr)
                    75px;

                gap: 8px;

                padding: 10px;
            }

            .game-logo-box {
                width: 64px;
                height: 64px;
            }

            .game-name {
                font-size: 15px;
            }

            .signup-bonus {
                font-size: 12px;
            }

            .minimum-withdrawal {
                font-size: 11px;
            }

            .download-btn {
                width: 70px;
                font-size: 12px;
            }
        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header class="header">

        <h1>🎮 YONO GAMES</h1>

        <p>Play • Download • Enjoy</p>

    </header>


    <!-- SEARCH -->

    <div class="search-box">

        <input
            type="text"
            id="search"
            placeholder="🔍 Search games..."
            autocomplete="off"
        >

    </div>


    <!-- TABS -->

    <div class="tabs">

        <button
            type="button"
            class="tab active"
            id="yono-tab"
        >
            🎮 YONO GAMES
        </button>

        <button
            type="button"
            class="tab"
            id="others-tab"
        >
            🎮 OTHERS GAMES
        </button>

    </div>


    <!-- GAMES -->

    <main id="game-list">

        <div class="message">
            Loading games...
        </div>

    </main>


    <!-- FOOTER -->

    <div class="footer">
        © 2026 YONO GAMES
    </div>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- SCRIPT -->

    <script src="./script.js?v=7"></script>

</body>

    </html>
