<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YONO GAMES</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: Arial, sans-serif;
    background:
        radial-gradient(circle at top, #0b5c3f 0%, #031c14 55%, #020d09 100%);
    color: white;
}

/* HEADER */

.header {
    text-align: center;
    padding: 18px 10px 12px;
}

.header h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 1px;
}

/* SEARCH */

.search-box {
    width: calc(100% - 24px);
    max-width: 600px;
    margin: 5px auto 14px;
}

.search-box input {
    width: 100%;
    height: 46px;
    padding: 0 16px;
    border: 1px solid #16875b;
    border-radius: 24px;
    outline: none;
    background: #062d20;
    color: white;
    font-size: 16px;
}

.search-box input::placeholder {
    color: #9bbcaf;
}

/* CATEGORY BUTTONS */

.category-buttons {
    display: flex;
    gap: 10px;
    width: calc(100% - 24px);
    max-width: 600px;
    margin: 0 auto 16px;
}

.category-btn {
    flex: 1;
    height: 48px;
    border: 1px solid #19a66d;
    border-radius: 12px;
    background: #073d2a;
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,0.3);
}

.category-btn:active {
    transform: scale(0.98);
}

.category-btn:hover {
    background: #0b543b;
}

/* GAMES */

#game-list {
    width: calc(100% - 16px);
    max-width: 700px;
    margin: 0 auto;
    padding-bottom: 25px;
}

/* GAME CARD */

.game-card {
    position: relative;
    display: grid;
    grid-template-columns: 78px 1fr 100px;
    gap: 12px;

    width: 100%;
    min-height: 145px;

    margin-bottom: 13px;
    padding: 13px;

    background:
        linear-gradient(145deg, #0b543b, #063d2a);

    border: 1px solid #147a52;
    border-left: 5px solid #18a66c;

    border-radius: 14px;

    box-shadow:
        0 5px 16px rgba(0,0,0,0.35);
}

/* LOGO */

.game-logo {
    width: 78px;
    height: 78px;

    border-radius: 15px;
    overflow: hidden;

    background: #08281d;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 35px;
    border: 1px solid #16875b;
}

.game-logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* GAME INFO */

.game-info {
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.game-name {
    font-size: 19px;
    font-weight: 800;
    margin-bottom: 9px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.signup {
    color: #ff5b5b;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 7px;
}

.withdraw {
    color: white;
    font-size: 13px;
    font-weight: 600;
}

/* DOWNLOAD */

.game-action {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.download-btn {
    display: flex;
    align-items: center;
    justify-content: center;

    width: 92px;
    height: 43px;

    background: #19a66d;
    color: white;

    text-decoration: none;
    font-size: 14px;
    font-weight: 800;

    border-radius: 10px;

    box-shadow: 0 3px 8px rgba(0,0,0,0.3);
}

.download-btn:hover {
    background: #20bb7a;
}

.game-meta {
    margin-top: 9px;

    font-size: 12px;
    font-weight: 700;

    color: #d5eee3;
    text-align: center;
}

/* MESSAGE */

.message {
    text-align: center;
    padding: 30px 10px;
    color: #b9d8cb;
    font-size: 16px;
}

/* MOBILE */

@media (max-width: 480px) {

    .header h1 {
        font-size: 24px;
    }

    .game-card {
        grid-template-columns: 72px 1fr 86px;
        gap: 9px;
        min-height: 135px;
        padding: 11px;
    }

    .game-logo {
        width: 72px;
        height: 72px;
    }

    .game-name {
        font-size: 17px;
        margin-bottom: 7px;
    }

    .signup {
        font-size: 13px;
    }

    .withdraw {
        font-size: 12px;
    }

    .download-btn {
        width: 82px;
        height: 40px;
        font-size: 13px;
    }

    .game-meta {
        font-size: 11px;
    }
}

</style>
</head>

<body>

<div class="header">
    <h1>🎮 YONO GAMES</h1>
</div>

<div class="search-box">
    <input
        type="text"
        id="search"
        placeholder="🔍 Search games..."
    >
</div>

<div class="category-buttons">

    <button
        id="yono-btn"
        class="category-btn"
    >
        🎮 YONO GAMES
    </button>

    <button
        id="others-btn"
        class="category-btn"
    >
        🎮 OTHERS GAMES
    </button>

</div>

<div id="game-list">
    <div class="message">
        Loading games...
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="script.js"></script>

</body>
    </html>
