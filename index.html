<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>YONO GAMES</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;

    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(
            circle at 50% 10%,
            rgba(0,255,40,.10),
            transparent 30%
        ),
        linear-gradient(
            180deg,
            #001b08 0%,
            #002b10 45%,
            #001d0a 100%
        );
}


/* =========================
   HEADER
========================= */

.header {
    text-align: center;
    padding: 18px 10px 10px;
}

.header h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 1px;
}

.tagline {
    margin: 8px 10px 0;
    color: #9fffae;
    font-size: 14px;
    font-weight: 600;
}


/* =========================
   BANNER
========================= */

.banner-section {
    width: calc(100% - 24px);
    max-width: 900px;

    margin: 12px auto 18px;

    overflow: hidden;

    aspect-ratio: 2.35 / 1;

    border: 1px solid #39ff14;
    border-radius: 16px;

    background: #063b16;

    box-shadow:
        0 0 15px rgba(57,255,20,.25);
}

.banner-slider {
    display: flex;

    width: 100%;
    height: 100%;

    transition:
        transform .7s ease-in-out;
}

.banner-slide {
    flex: 0 0 100%;

    width: 100%;
    height: 100%;
}

.banner-slide img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: cover;
}


/* =========================
   TELEGRAM
========================= */

.telegram-section {
    width: calc(100% - 24px);
    max-width: 900px;

    margin: 0 auto 20px;

    text-align: center;
}

.telegram-title {
    font-size: 20px;
    font-weight: 800;

    margin-bottom: 10px;
}

.telegram-btn {
    display: flex;

    align-items: center;
    justify-content: center;

    width: 100%;
    min-height: 52px;

    border-radius: 14px;

    background:
        linear-gradient(
            180deg,
            #39ff14,
            #16b900
        );

    color: white;

    text-decoration: none;

    font-size: 18px;
    font-weight: 800;

    box-shadow:
        0 0 14px rgba(57,255,20,.40);

    transition: .15s;
}

.telegram-btn:active {
    transform: scale(.98);
}


/* =========================
   DOWNLOAD NEW GAMES
========================= */

.category-heading {
    width: calc(100% - 24px);
    max-width: 900px;

    margin: 0 auto 10px;

    text-align: center;

    color: white;

    font-size: 20px;
    font-weight: 800;

    letter-spacing: .5px;
}


/* =========================
   SEARCH
========================= */

.search-box {
    width: calc(100% - 24px);
    max-width: 900px;

    height: 58px;

    margin: 0 auto 15px;

    border: 1px solid #39ff14;
    border-radius: 18px;

    background: rgba(0,45,10,.65);

    display: flex;

    align-items: center;

    padding: 0 18px;
}

.search-box input {
    width: 100%;
    height: 100%;

    border: none;
    outline: none;

    background: transparent;

    color: white;

    font-size: 17px;
}

.search-box input::placeholder {
    color: #aaa;
}


/* =========================
   CATEGORY
========================= */

.category-buttons {
    display: grid;

    grid-template-columns: 1fr 1fr;

    width: calc(100% - 24px);
    max-width: 900px;

    margin: 0 auto 18px;

    padding: 6px;

    border: 1px solid #39ff14;
    border-radius: 20px;

    background: rgba(0,35,8,.35);
}

.category-btn {
    height: 48px;

    border: none;

    border-radius: 14px;

    background: transparent;

    color: #999;

    font-size: 16px;
    font-weight: 700;

    cursor: pointer;
}

.category-btn.active {
    color: white;

    background:
        linear-gradient(
            180deg,
            #49ff18,
            #17bd00
        );

    box-shadow:
        0 0 16px rgba(57,255,20,.55);
}


/* =========================
   NEW LAUNCH
========================= */

.new-launch-section {
    width: calc(100% - 16px);
    max-width: 900px;

    margin: 0 auto 20px;
}

.new-launch-title {
    text-align: center;

    font-size: 20px;
    font-weight: 800;

    margin-bottom: 10px;
}


/* =========================
   GAME LIST
========================= */

#game-list {
    width: calc(100% - 16px);
    max-width: 900px;

    margin: 0 auto;

    padding-bottom: 30px;
}


/* =========================
   GAME CARD
========================= */

.game-card {
    display: grid;

    grid-template-columns:
        145px
        1fr
        250px;

    gap: 15px;

    width: 100%;

    min-height: 155px;

    margin-bottom: 15px;

    padding: 14px;

    background:
        linear-gradient(
            90deg,
            rgba(0,45,12,.96),
            rgba(0,70,18,.65)
        );

    border: 1px solid #28e916;

    border-radius: 20px;

    box-shadow:
        0 0 10px rgba(57,255,20,.20);

    align-items: center;
}


/* LOGO */

.game-logo {
    width: 130px;
    height: 130px;

    border: 1px solid rgba(100,255,80,.8);

    border-radius: 18px;

    background: #063b16;

    overflow: hidden;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 45px;
}

.game-logo img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}


/* INFO */

.game-info {
    min-width: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;
}

.game-name {
    font-size: 26px;

    font-weight: bold;

    margin-bottom: 12px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.signup {
    color: #ff5b5b;

    font-size: 18px;

    font-weight: 700;

    margin-bottom: 7px;
}

.withdraw {
    color: white;

    font-size: 18px;

    font-weight: 600;
}


/* ACTION */

.game-action {
    display: flex;

    flex-direction: column;

    justify-content: center;

    gap: 10px;
}


/* DOWNLOAD */

.download-btn {
    min-height: 58px;

    display: flex;

    align-items: center;

    justify-content: center;

    width: 100%;

    border-radius: 14px;

    text-decoration: none;

    background:
        linear-gradient(
            180deg,
            #48ff18,
            #18bd00
        );

    color: white;

    font-size: 20px;

    font-weight: bold;

    box-shadow:
        0 0 14px rgba(57,255,20,.45);
}


/* META */

.game-meta {
    display: flex;

    align-items: center;

    justify-content: center;

    gap: 12px;

    font-size: 18px;

    font-weight: 600;

    white-space: nowrap;
}

.star {
    color: #ffd900;

    font-size: 23px;
}

.separator {
    color: #aaa;
}


/* MESSAGE */

.message {
    text-align: center;

    padding: 35px 10px;

    color: #aaa;

    font-size: 18px;
}


/* =========================
   MENU
========================= */

.menu-container {
    position: fixed;

    top: 12px;
    left: 12px;

    z-index: 9999;
}

.menu-btn {
    width: 42px;
    height: 42px;

    border: 1px solid #39ff14;

    border-radius: 50%;

    background: #063b16;

    color: white;

    font-size: 28px;

    cursor: pointer;
}

.menu-box {
    display: none;

    position: absolute;

    top: 48px;
    left: 0;

    width: 170px;

    padding: 8px;

    background: #063b16;

    border: 1px solid #39ff14;

    border-radius: 12px;
}

.menu-box.show {
    display: block;
}

.menu-box a {
    display: block;

    padding: 12px 10px;

    color: white;

    text-decoration: none;
}


/* =========================
   MOBILE
========================= */

@media (max-width:700px) {

    .header {
        padding: 16px 12px 8px;
    }

    .header h1 {
        font-size: 24px;
    }

    .tagline {
        font-size: 12px;
        line-height: 1.4;
    }


    .banner-section {
        width: calc(100% - 16px);

        border-radius: 12px;

        margin-bottom: 15px;
    }


    .telegram-section {
        width: calc(100% - 16px);
    }

    .telegram-title {
        font-size: 16px;
    }

    .telegram-btn {
        min-height: 45px;

        font-size: 15px;

        border-radius: 10px;
    }


    .category-heading {
        font-size: 16px;
    }


    .search-box {
        width: calc(100% - 16px);

        height: 50px;

        border-radius: 14px;
    }


    .category-buttons {
        width: calc(100% - 16px);

        border-radius: 16px;
    }

    .category-btn {
        height: 42px;

        font-size: 13px;
    }


    .new-launch-title {
        font-size: 16px;
    }


    .game-card {
        min-height: 78px;

        grid-template-columns:
            42px
            minmax(0,1fr)
            72px;

        gap: 6px;

        padding: 6px;

        border-radius: 10px;

        margin-bottom: 8px;
    }


    .game-logo {
        width: 42px;
        height: 42px;

        border-radius: 8px;

        font-size: 17px;
    }


    .game-name {
        font-size: 14px;

        margin-bottom: 3px;
    }

    .signup {
        font-size: 10px;

        margin-bottom: 2px;
    }

    .withdraw {
        font-size: 10px;
    }


    .game-action {
        gap: 4px;
    }


    .download-btn {
        min-height: 28px;

        font-size: 10px;

        padding: 4px 3px;

        border-radius: 7px;
    }


    .game-meta {
        font-size: 8px;

        gap: 3px;
    }

    .star {
        font-size: 9px;
    }

}


/* SMALL MOBILE */

@media (max-width:380px) {

    .game-card {
        grid-template-columns:
            38px
            minmax(0,1fr)
            65px;

        gap: 5px;

        padding: 5px;
    }

    .game-logo {
        width: 38px;
        height: 38px;
    }

    .game-name {
        font-size: 12px;
    }

    .signup {
        font-size: 8px;
    }

    .withdraw {
        font-size: 8px;
    }

    .download-btn {
        min-height: 24px;

        font-size: 9px;
    }

    .game-meta {
        font-size: 7px;
    }

}

</style>
</head>
